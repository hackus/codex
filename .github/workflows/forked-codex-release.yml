name: forked-codex-release

on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: forked-codex-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release forked Windows Codex
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo build output
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: forked-codex-windows-x64-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: |
            forked-codex-windows-x64-

      - name: Verify background processes stay console-free
        shell: pwsh
        run: |
          cargo test --locked -p codex-utils-process --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p codex-utils-pty --lib console
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select and embed fork release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTags = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not list fork releases.' }
          $releaseTags = $releaseTags | ConvertFrom-Json
          $latestForkVersion = $releaseTags | ForEach-Object {
            if ($_.tagName -match '^forked-codex-v(\d+)\.(\d+)\.(\d+)$') {
              [PSCustomObject]@{ Major = [int]$Matches[1]; Minor = [int]$Matches[2]; Patch = [int]$Matches[3] }
            }
          } | Sort-Object Major, Minor, Patch -Descending | Select-Object -First 1
          if ($latestForkVersion) {
            $codexVersion = "{0}.{1}.{2}" -f $latestForkVersion.Major, $latestForkVersion.Minor, ($latestForkVersion.Patch + 1)
          } else {
            $codexVersion = "0.0.1"
          }
          $tag = "forked-codex-v$codexVersion"
          $manifestPath = Join-Path $PWD "Cargo.toml"
          $manifest = [IO.File]::ReadAllText($manifestPath)
          $pattern = '(?m)(^\[workspace\.package\]\r?\nversion = ")[^"]+("\r?$)'
          if ([regex]::Matches($manifest, $pattern).Count -ne 1) {
            throw 'Expected exactly one workspace package version in Cargo.toml.'
          }
          $manifest = [regex]::Replace($manifest, $pattern, "`${1}$codexVersion`${2}")
          [IO.File]::WriteAllText($manifestPath, $manifest, [Text.UTF8Encoding]::new($false))
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$codexVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append


      - name: Build codex.exe
        shell: bash
        run: |
          set -euo pipefail
          export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          STABLE_GIT_COMMIT="$(git rev-parse HEAD)"
          export STABLE_GIT_COMMIT
          cargo build --target x86_64-pc-windows-msvc --profile dev-small --bin codex

      - name: Stage release assets
        shell: pwsh
        env:
          CODEX_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $assetDir = Join-Path $env:GITHUB_WORKSPACE "dist/forked-codex"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/codex-rs/target/x86_64-pc-windows-msvc/dev-small/codex.exe" -Destination "$assetDir/codex.exe"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/LICENSE" -Destination "$assetDir/LICENSE"
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE/NOTICE" -Destination "$assetDir/NOTICE"
          $codexVersion = $env:CODEX_VERSION
          $tag = $env:RELEASE_TAG
          $versionOutput = (& "$assetDir/codex.exe" --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionOutput -cne "codex-cli $codexVersion") {
            throw "Built executable version '$versionOutput' does not match release $codexVersion."
          }
          $versionOutput | Out-File -FilePath "$assetDir/codex-version.txt" -Encoding utf8
          @{
            patch = "windows-background-process-consoles"
            commit = "${{ github.sha }}"
            branch = "${{ github.ref_name }}"
            version = $codexVersion
            tag = $tag
            asset = "codex.exe"
            license = "LICENSE"
            notice = "NOTICE"
          } | ConvertTo-Json | Out-File -FilePath "$assetDir/forked-codex-manifest.json" -Encoding utf8

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CODEX_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/forked-codex-release-notes.md"
          cat > "$notes" <<'EOF'
            Temporary Windows Codex build from hackus/codex with audited windowless background-process launches.

            H-Codex downloads `codex.exe` from this release when users run `/switch_to_forked_codex`.
            Users can return to the official Codex install with `/switch_to_official_codex`.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              ../dist/forked-codex/codex.exe \
              ../dist/forked-codex/codex-version.txt \
              ../dist/forked-codex/LICENSE \
              ../dist/forked-codex/NOTICE \
              ../dist/forked-codex/forked-codex-manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Forked Codex $CODEX_VERSION Windows background process console fixes" \
              --notes-file "$notes" \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              ../dist/forked-codex/codex.exe \
              ../dist/forked-codex/codex-version.txt \
              ../dist/forked-codex/LICENSE \
              ../dist/forked-codex/NOTICE \
              ../dist/forked-codex/forked-codex-manifest.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Forked Codex $CODEX_VERSION Windows background process console fixes" \
              --notes-file "$notes" \
              --latest
          fi
